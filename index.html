<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك في Berazi16</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        a {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
            font-weight: bold;
        }
        
        a:hover {
            background: #764ba2;
        }
        
        .info {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            margin-top: 30px;
            text-align: right;
        }
        
        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 مرحباً بك في Berazi16</h1>
        <p>موقعك الشخصي الآن على الإنترنت!</p>
        
        <div class="links">
            <a href="https://github.com/sakamax2/Berazi16" target="_blank">📂 المستودع على GitHub</a>
            <a href="mailto:contact@example.com">📧 تواصل معي</a>
        </div>
        
        <div class="info">
            <h3>ℹ️ معلومات</h3>
            <p>هذا الموقع تم نشره باستخدام GitHub Pages</p>
            <p><strong>رابط الموقع:</strong> <br>https://sakamax2.github.io/Berazi16</p>
        </div>
    </div>
</body>
</html>
